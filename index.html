const E=[
{n:"مغنيسيوم + HCl",t:"حمض HCl مخفف",c:"#cfeeff",item:"شريط مغنيسيوم",ic:"#9aa5b1",bub:3,heat:16,solid:1,obs:"فقاعات كثيرة من غاز الهيدروجين، والشريط يذوب، والأنبوبة بتسخن. جرّب اختبار الفرقعة!",eq:"Mg + 2HCl → MgCl₂ + H₂↑",pop:1},

{n:"نترات المغنيسيوم + NaOH",t:"محلول نترات المغنيسيوم",c:"#e8f4ff",item:"محلول NaOH",ic:"#7fd6ff",bub:0,heat:2,solid:0,ppt:1,obs:"ظهر راسب أبيض عكّر المحلول: هيدروكسيد المغنيسيوم لا يذوب في الماء.",eq:"Mg(NO₃)₂ + 2NaOH → Mg(OH)₂↓ + 2NaNO₃"},
{n:"نترات الصوديوم + HCl",t:"حمض HCl مخفف",c:"#cfeeff",item:"نترات صوديوم",ic:"#ffffff",bub:0,heat:0,solid:1,obs:"مفيش فقاعات ولا راسب ولا حرارة: نترات الصوديوم مجرد بتذوب ولا تتفاعل مع الحمض.",eq:"NaNO₃ + HCl → لا يحدث تفاعل"}];
let cur=0,busy=false,drag=null,sound=true,ac=null,timer=null;
function say(t){$("msg").innerHTML=t}
function actx(){if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}return ac}
function noise(d,f,v){if(!sound||!actx())return;const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
 const s=ac.createBufferSource();s.buffer=b;const q=ac.createBiquadFilter();q.type="bandpass";q.frequency.value=f;const g=ac.createGain();g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);s.connect(q);q.connect(g);g.connect(ac.destination);s.start()}
function popS(){if(!sound||!actx())return;noise(.15,1200,.9);const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(700,ac.currentTime);o.frequency.exponentialRampToValueAtTime(90,ac.currentTime+.12);g.gain.setValueAtTime(.6,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.15);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.16)}
function put(g,x,y){g.setAttribute("transform",`translate(${x},${y}) scale(1.6)`)}
function pt(e){const q=sv.createSVGPoint();q.x=e.clientX;q.y=e.clientY;return q.matrixTransform(sv.getScreenCTM().inverse())}
function mk(tag,a,p){const c=document.createElementNS(NS,tag);for(const k in a)c.setAttribute(k,a[k]);p.appendChild(c);return c}
for(let i=0;i<22;i++){const c=mk("circle",{cx:Math.random()*1672,cy:300+Math.random()*600,r:2+Math.random()*4,fill:"#bfe3ff",opacity:.35},$("amb"));c.style.animation=`fl ${3+Math.random()*4}s ease-in-out ${Math.random()*3}s infinite`}
function setT(T){$("tt").textContent=T.toFixed(0);const h=20+(T-25)*11;$("mer").setAttribute("y",840-h);$("mer").setAttribute("height",h)}
function load(i){clearInterval(timer);cur=i;busy=false;const x=E[i];$("sv").parentNode.classList.remove("shake");
 $("tabs").innerHTML=E.map((e,k)=>`<button class="tab ${k==i?'on':''}" onclick="load(${k})">${e.n}</button>`).join("");
 $("liq").setAttribute("fill",x.c);$("refl").firstChild.setAttribute("fill",x.c);$("cloud").setAttribute("opacity",0);$("sol").setAttribute("opacity",0);$("bub").innerHTML="";$("fz").innerHTML="";
 $("ib").setAttribute("fill",x.ic);$("in").textContent=x.item;$("il").textContent=x.solid?"صلب":"محلول";$("tlab").textContent="داخل الإزازة: "+x.t;$("holo").textContent="";
 setT(25);$("pop").style.display="none";put($("item"),250,790);$("item").style.display="";$("tgt").style.display="";
 say("أنا لابس النظارة والبالطو والقفازات! امسك "+x.item+" من على الترابيزة بإيدك واسحبها فوق فوهة الإزازة.")}
$("item").addEventListener("pointerdown",e=>{if(busy)return;drag=$("item");drag.setPointerCapture(e.pointerId);const p=pt(e);put(drag,p.x,p.y)});
$("item").addEventListener("pointermove",e=>{if(!drag)return;const p=pt(e);put(drag,p.x,p.y)});
$("item").addEventListener("pointerup",e=>{if(!drag)return;drag=null;const p=pt(e);if(Math.hypot(p.x-836,p.y-520)<230)react();else{put($("item"),250,790);say("قرّب المادة من فوهة الإزازة (الدائرة الوردية).")}});
function react(){busy=true;const x=E[cur];$("item").style.display="none";$("tgt").style.display="none";actx();
 if(x.solid){$("sol").setAttribute("fill",x.ic);$("sol").setAttribute("opacity",1)}

 say("بدأ التفاعل... راقب الإزازة بتركيز!");if(x.bub)noise(7,3500,x.bub*.12);
 let t=0;timer=setInterval(()=>{t++;
  for(let k=0;k<x.bub;k++){const c=mk("circle",{cx:785+Math.random()*100,cy:845-Math.random()*40,r:3+Math.random()*7,fill:"#fff","fill-opacity":.6,stroke:"#7ec8ff","class":"bb"},$("bub"));setTimeout(()=>c.remove(),1500);
   if(x.bub>2&&Math.random()<.5){const f=mk("circle",{cx:775+Math.random()*120,cy:655+Math.random()*10,r:6+Math.random()*10,fill:"#fff",stroke:"#9ad4ff","class":"fo"},$("fz"));setTimeout(()=>f.remove(),1200)}}
  if(x.ppt)$("cloud").setAttribute("opacity",Math.min(.95,t/50));
  if(x.solid)$("sol").setAttribute("opacity",Math.max(0,1-t/(x.bub?70:60)));
  setT(25+x.heat*Math.min(1,t/60));
  if(t>=80){clearInterval(timer);$("sv").parentNode.classList.remove("shake");$("sol").setAttribute("opacity",0);say(x.obs);$("holo").textContent=x.eq;if(x.pop)$("pop").style.display="inline-block"}},100)}
$("pop").onclick=()=>{popS();const g=$("glow");g.setAttribute("opacity",.95);setTimeout(()=>g.setAttribute("opacity",0),160);say("سمعت فرقعة صغيرة؟ ده معناه وجود غاز الهيدروجين (بإشراف المعلم وكمية صغيرة جدًا).")};
$("rst").onclick=()=>load(cur);
$("snd").onclick=()=>{sound=!sound;$("snd").textContent="الصوت: "+(sound?"يعمل":"متوقف")};
load(0);</script></body></html>
